name: Sync Outlit docs skill

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-outlit-docs-skill
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Fetch canonical skill and update generated docs artifact
        run: node scripts/sync-outlit-skill.mjs --sync

      - name: Verify pinned artifact
        run: node scripts/sync-outlit-skill.mjs --check

      - name: Open or update review PR when skill content changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/sync-outlit-docs-skill
          base: main
          add-paths: |
            docs/skill.md
            docs/skill-source.json
          commit-message: "docs: sync canonical Outlit skill"
          title: "docs: sync canonical Outlit skill"
          body: |
            Refreshes the Mintlify skill override from `OutlitAI/skills` at the immutable revision recorded in `docs/skill-source.json`.

            The skill prose and frontmatter come from upstream. Only relative reference targets are changed to raw GitHub URLs pinned to that same revision.

            Review the source diff and trigger the required PR checks on this bot-authored PR before merging. Mintlify updates after the merge deploys.
          labels: skip-changelog
